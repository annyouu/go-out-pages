        <h1>go outについて</h1>
        <p>
          go outは、朝のアプリ習慣を「外に出る行動」に変えるためのiPhoneアプリです。
          ブロックしたいアプリやWebサイトを選び、目的地を地図に設定します。
          指定した時間に対象アプリを開こうとすると、go outが外に出るきっかけを作ります。
        </p>
        <p>
          アカウント登録は不要です。現在地の履歴やSNSの内容は保存しません。
          詳しくはプライバシーポリシーをご確認ください。
        </p>
